name: Load data into Supabase

on:
  workflow_dispatch:
    inputs:
      tables:
        description: 'Tables to load (space separated, blank = all)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['data/export/**']

concurrency: load-data

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load
        env:
          SUPABASE_URL: https://hxgckcriehvrolwnabpd.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "Add the SUPABASE_SERVICE_ROLE_KEY repository secret first."; exit 1; fi
          python scripts/load_supabase.py ${{ github.event.inputs.tables }}

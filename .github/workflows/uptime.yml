name: Uptime check
# Backup check. The main monitor runs inside Supabase every 5 minutes (supabase/functions/uptime) and emails
# admin@squaredawaylabs.com when something goes down. This workflow checks the sites independently of Supabase, and checks
# that the Supabase monitor itself has run in the last 20 minutes. GitHub may delay scheduled runs; a failed run emails
# the repo owner.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check endpoints
        run: |
          fail=0
          check() { # name url must-contain
            for i in 1 2 3; do
              body=$(curl -sS -L --max-time 20 -w '\n%{http_code}' "$2" 2>&1) && code=$(echo "$body" | tail -1) || code=000
              if [ "$code" = "200" ] && echo "$body" | grep -q "$3"; then echo "ok   $1"; return; fi
              sleep 10
            done
            echo "::error::$1 is down (HTTP $code): $2"; fail=1
          }
          check "App" "https://app.capitolreceipts.com/" "Capitol"
          check "Website" "https://www.capitolreceipts.com/" "Capitol Receipts"
          check "Record page" "https://www.capitolreceipts.com/member/P000197/nancy-pelosi" "Pelosi"
          check "Data proxy" "https://app.capitolreceipts.com/api/db?q=app_meta%3Fselect%3Dkey%26key%3Deq.asOf" "asOf"
          # the 5-minute monitor in Supabase must still be running
          last=$(curl -sS --max-time 20 "https://hxgckcriehvrolwnabpd.supabase.co/rest/v1/service_status?select=checked_at&order=checked_at.desc&limit=1" \
            -H "apikey: sb_publishable_jiwF5q1sFMuaGXLKg6FKAQ_3rCjcZ1J" | grep -o '"checked_at":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$last" ] || [ $(( $(date +%s) - $(date -d "$last" +%s) )) -gt 1200 ]; then
            echo "::error::The 5-minute uptime monitor in Supabase hasn't run since ${last:-ever}"; fail=1
          else echo "ok   Supabase monitor ran at $last"; fi
          exit $fail

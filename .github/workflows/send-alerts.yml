name: Send alert emails
# Runs the alert email job on its own, without a full data update. The daily update also calls it.
on:
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send alert emails
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          KEY="${SUPABASE_SECRET_KEY:-$SUPABASE_SERVICE_ROLE_KEY}"
          code=$(curl -s -m 280 -o out.json -w "%{http_code}" -X POST https://hxgckcriehvrolwnabpd.supabase.co/functions/v1/send-alerts \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"; cat out.json; echo
          test "$code" = 200

name: Warm the data cache

# Each new deploy and each data load starts the CDN cache empty; fetch the app's shared data once so the first
# real visitors get it instantly instead of waiting on the database.
on:
  deployment_status:
  workflow_run:
    workflows: ['Daily data update']
    types: [completed]
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:

jobs:
  warm:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch shared data through the cache
        run: |
          sleep 20
          B="https://app.capitolreceipts.com/api/db?q="
          enc() { python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe="-_.!~*()"+chr(39)))' "$1"; }
          paths=(
            "members?select=data&order=ord&limit=1000&offset=0"
            "nominations?select=data&order=ord&limit=1000&offset=0"
            "roll_calls?select=id,data&order=ord&limit=1000&offset=0"
            "photos?select=id,img&order=id&limit=1000&offset=0"
            "app_meta?select=key,value&key=in.(asOf,months,passage,lobby,parties,lobbied_bills)"
            "app_meta?select=key,value&key=in.(hist_control,hist_kv,hist_PK,hist_meta,hist_curApps)"
            "app_meta?select=key,value&key=in.(pages_leaders,pages_mc,pages_issue)"
            "app_meta?select=key,value&key=in.(updated)"
            "app_meta?select=key,value&key=in.(tick_ind)"
          )
          for k in people careers appointees bills pacs lobby_clients lobby_firms committees ethics; do paths+=("rpc/get_light?kind=$k"); done
          for p in "${paths[@]}"; do
            for try in 1 2 3; do
              out=$(curl -s -o /dev/null -H 'Accept-Encoding: gzip' -w '%{http_code} %{time_total}s %header{x-vercel-cache}' --max-time 90 "$B$(enc "$p")")
              echo "$out  $p"
              case "$out" in 200*) break;; esac
              sleep 10
            done
          done

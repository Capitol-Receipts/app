name: Daily data update

on:
  schedule:
    - cron: '15 10 * * *'   # every day, about 6:15 a.m. Eastern
    - cron: '20 12 * * *'   # backup, about 8:20 a.m. Eastern (skips if today's update already ran)
    - cron: '20 14 * * *'   # second backup, about 10:20 a.m. Eastern
    - cron: '5 15,17,19,21,23 * * 1-5'   # weekdays every 2 hours, 11 a.m. to 7 p.m. Eastern: new trade reports for Pro same-day alerts
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/daily-update.yml']
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Also refresh weekly sources (ethics, lobbying, companies, judges, caucuses, lobbyist donations)'
        type: boolean
        default: false

concurrency: daily-update

permissions:
  contents: read
  actions: read

jobs:
  # Scheduled runs only: skip if an update already finished successfully today (GitHub often starts schedules hours late).
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # same-day runs always go ahead
          if [ "${{ github.event.schedule }}" = "5 15,17,19,21,23 * * 1-5" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u +%Y-%m-%dT10:00:00Z)
          done=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-update.yml/runs?status=success&created=>=$since&per_page=5" --jq '.total_count')
          if [ "${done:-0}" -gt 0 ]; then echo "Today's update already ran."; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q pyyaml openpyxl pillow
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: work
          key: pipeline-state-${{ github.run_id }}
          restore-keys: pipeline-state-
      - name: Seed pipeline state on first run
        run: |
          if [ ! -f work/hist.json ]; then
            git fetch --depth 1 origin pipeline-seed
            mkdir -p work seedtmp
            git --work-tree=seedtmp checkout origin/pipeline-seed -- .
            cat seedtmp/seed.tar.gz.part* | tar -xz -C work
            rm -rf seedtmp
            git reset -q
          fi
          du -sh work
      - name: Refresh and rebuild
        env:
          INTRADAY: ${{ github.event.schedule == '5 15,17,19,21,23 * * 1-5' && '1' || '' }}
        run: python pipeline/daily.py work ${{ github.event.inputs.weekly == 'true' && '--weekly' || '' }}
      - name: Load changed tables into Supabase
        env:
          SUPABASE_URL: https://hxgckcriehvrolwnabpd.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPORT_DIR: work/export
        run: |
          TABLES=$(cat work/changed.txt)
          if [ -z "$TABLES" ]; then echo "Nothing changed today."; exit 0; fi
          python scripts/load_supabase.py $TABLES
      - name: Send alert emails
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s -m 280 -X POST https://hxgckcriehvrolwnabpd.supabase.co/functions/v1/send-alerts \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -d '{}' | tee -a work/last_run.txt || true
      - name: Save pipeline state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: work
          key: pipeline-state-${{ github.run_id }}
      - name: Summary
        if: always()
        run: cat work/last_run.txt >> "$GITHUB_STEP_SUMMARY" || true

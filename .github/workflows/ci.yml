name: Checks

# Every push to any branch and every pull request: scripts parse, config files are valid and the unit tests pass.
# Two database jobs run when their secrets exist and are skipped (with a note) until then:
#   types: the committed supabase/types.ts must match the live database (needs SUPABASE_ACCESS_TOKEN)
#   rls:   supabase/tests/rls.sql proves row-level security holds (needs SUPABASE_DB_URL; read-only, rolled back)
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Database types match the live database
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::notice::Skipped: add the SUPABASE_ACCESS_TOKEN secret to check supabase/types.ts"; exit 0; fi
          npx -y supabase@2 gen types typescript --project-id hxgckcriehvrolwnabpd --schema public > /tmp/types.ts
          if ! diff -u supabase/types.ts /tmp/types.ts; then
            echo "::error::supabase/types.ts is out of date. Regenerate it (supabase gen types typescript --project-id hxgckcriehvrolwnabpd --schema public) and commit."
            exit 1
          fi

  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Row-level security tests
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::notice::Skipped: add the SUPABASE_DB_URL secret to run supabase/tests/rls.sql"; exit 0; fi
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/tests/rls.sql

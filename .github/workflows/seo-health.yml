name: Search health check

on:
  schedule:
    - cron: '20 14 * * 1'   # Mondays, about 10:20 a.m. Eastern
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check pages, sitemaps and links
        id: check
        run: python scripts/seo_health.py 12
      - name: Open or update an issue when something needs attention
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create seo-health --color c8323a --description "Search health check" 2>/dev/null || true
          N=$(gh issue list --label seo-health --state open --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body-file seo_health_report.md
          else gh issue create --title "Search health check found problems" --label seo-health --body-file seo_health_report.md; fi

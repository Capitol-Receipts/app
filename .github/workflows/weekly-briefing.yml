name: Weekly Pro briefing
# Fridays about 4:30 p.m. Eastern: the week's biggest trades, closest votes, new laws and lobbying fights, to Pro subscribers.
on:
  schedule:
    - cron: '30 20 * * 5'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (count who would get it, send nothing)'
        type: boolean
        default: true
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send the briefing
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry == 'true' && 'true' || 'false' }}
        run: |
          code=$(curl -s -m 280 -o out.json -w "%{http_code}" -X POST https://hxgckcriehvrolwnabpd.supabase.co/functions/v1/send-alerts \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -d "{\"mode\":\"briefing\",\"dry\":$DRY}")
          echo "HTTP $code"; cat out.json; echo
          test "$code" = 200

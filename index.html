<style>
  .boot{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px;font-family:"Schibsted Grotesk",system-ui,sans-serif;color:var(--soft,#5b6069)}
  .boot b{display:block;font:800 26px "Barlow Condensed",system-ui,sans-serif;color:var(--ink,#0e1116);letter-spacing:-.01em}
  .boot b span{background:#c8323a;color:#fff;padding:1px 7px 2px;border-radius:5px;margin-right:3px}

<body>
<div id="app"><div class="boot"><div><b><span>Capitol</span>Receipts</b><p id="bootmsg">Loading the latest records…</p></div></div></div>
<nav class="tabbar" aria-label="Main"><div class="in" id="tabbar"></div></nav>
<div id="sheet" class="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<script>
/* Supabase: public, read-only access (publishable key; tables are protected by row-level security) */
window.SB={url:'https://hxgckcriehvrolwnabpd.supabase.co',key:'sb_publishable_jiwF5q1sFMuaGXLKg6FKAQ_3rCjcZ1J'};
SB.req=async(path,opt={},tries=3)=>{
  for(let i=0;;i++){
    let r;
    try{r=await fetch(SB.url+'/rest/v1/'+path,{method:opt.method||'GET',headers:Object.assign({apikey:SB.key,Accept:'application/json'},opt.body?{'Content-Type':'application/json'}:{},opt.headers||{}),body:opt.body})}
    catch(e){if(i+1<tries){await new Promise(f=>setTimeout(f,600*(i+1)));continue}throw e}
    if(r.ok)return r.json();
    if(r.status>=500&&i+1<tries){await new Promise(f=>setTimeout(f,600*(i+1)));continue}
    throw new Error(path.split('?')[0]+' '+r.status);
  }
};
SB.get=path=>SB.req(path);
/* page through tables bigger than the API's 1,000-row limit */
SB.all=async(path,size=1000)=>{let out=[],from=0;for(;;){const rows=await SB.req(path,{headers:{Range:`${from}-${from+size-1}`,'Range-Unit':'items'}});out=out.concat(rows);if(rows.length<size)return out;from+=size}};
SB.rpc=(fn,args)=>SB.req('rpc/'+fn,{method:'POST',body:JSON.stringify(args||{})});
SB.meta=async keys=>Object.fromEntries((await SB.get('app_meta?select=key,value&key=in.('+keys.join(',')+')')).map(r=>[r.key,r.value]));

const APP_VER='20261012t'; /* bump on every release so browsers and the CDN fetch fresh files */
const APP_SCRIPTS=['core','party','hist','ui','nav','pages','search','leaders','linkify','pacs','elections','companies','friendly','votes','places','extras','glossary_es','es_dict','i18n','db','account','trust','desktop'];
async function boot(){
  const msg=document.getElementById('bootmsg');
  try{
    const [members,noms,rc,meta,photos]=await Promise.all([
      SB.all('members?select=data&order=ord'),SB.all('nominations?select=data&order=ord'),SB.all('roll_calls?select=id,data&order=ord'),
      SB.meta(['asOf','months','passage','lobby','parties','lobbied_bills']),SB.all('photos?select=id,img&order=id')]);
    window.__DATA={asOf:meta.asOf,months:meta.months,members:members.map(r=>r.data),rc:Object.fromEntries(rc.map(r=>[r.id,r.data])),
      noms:noms.map(r=>r.data),passage:meta.passage,lobby:meta.lobby,bills:meta.lobbied_bills,parties:meta.parties};
    window.__PHOTOS=Object.fromEntries(photos.map(r=>[r.id,r.img]));
  }catch(e){
    console.error(e);
    msg.innerHTML='Couldn’t reach the database. Check your connection.<br><button onclick="location.reload()">Try again</button>';
    return;
  }
  for(const n of APP_SCRIPTS){const s=document.createElement('script');s.src='/app/js/'+n+'.js?v='+APP_VER;s.async=false;document.body.appendChild(s)}
}
boot();
</script>
</body>
